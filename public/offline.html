<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7C3AED">
    <title>Vidya is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #06080f;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 50% 10%, rgba(124, 58, 237, 0.3), transparent 40%),
          #06080f;
      }

      main {
        width: min(100%, 32rem);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid rgba(196, 181, 253, 0.3);
        border-radius: 1.5rem;
        background: #121629;
        text-align: center;
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
      }

      svg {
        width: 5rem;
        height: 5rem;
      }

      h1 {
        margin: 1rem 0 0;
        font-size: clamp(1.75rem, 7vw, 2.5rem);
        line-height: 1.1;
      }

      p {
        max-width: 27rem;
        margin: 1rem auto 1.5rem;
        color: #d8d9e6;
        font-size: 1rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        min-height: 2.75rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #8b5cf6;
        color: #fff;
        font-weight: 700;
        line-height: 1.25;
        text-decoration: none;
      }

      a:hover {
        background: #7c3aed;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 96 96" role="img" aria-label="A book waiting to reconnect">
        <circle cx="48" cy="48" r="46" fill="#7c3aed"/>
        <path d="M22 35c9-2.7 17.7-.3 26 7v29c-7.7-6.7-16.3-9-26-7V35Zm52 0c-9-2.7-17.7-.3-26 7v29c7.7-6.7 16.3-9 26-7V35Z" fill="#fff"/>
        <path d="M48 42v29" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h1>Vidya is offline</h1>
      <p>
        This page is not available without a connection. Check your internet and try again.
        Your saved learning progress has not been changed.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
