<script>
(() => {
  const tl = gsap.timeline({ paused: true });
  // The catalog flowchart's stroke reveal is applied to masks, preserving the poster's dashed path.
  const routes = [document.querySelector('#route-read'), document.querySelector('#route-create')];
  routes.forEach((route, index) => {
    const length = route.getTotalLength();
    tl.fromTo(route, { strokeDasharray: length, strokeDashoffset: length },
      { strokeDasharray: length, strokeDashoffset: 0, duration: .6, ease: 'none' }, index === 0 ? 1.2 : 2.8);
  });
  tl.addLabel('read', .1);
  tl.fromTo('#welcome-book', { opacity: 0 }, { opacity: 1, duration: .55, ease: 'power2.out' }, 'read');
  tl.fromTo('#welcome-dot-read', { opacity: 0 }, { opacity: 1, duration: .2, ease: 'power1.out' }, 1.4);
  tl.addLabel('investigate', 1.75);
  tl.fromTo('#welcome-investigate', { opacity: 0 }, { opacity: 1, duration: .55, ease: 'power3.out' }, 'investigate');
  tl.fromTo('#welcome-dot-create', { opacity: 0 }, { opacity: 1, duration: .2, ease: 'power1.out' }, 3);
  tl.addLabel('create', 3.25);
  tl.fromTo('#welcome-create', { opacity: 0 }, { opacity: 1, duration: .6, ease: 'sine.out' }, 'create');
  tl.addLabel('settled', 3.85);
  window.__timelines['vidya-welcome'] = tl;
  tl.seek(0);
})();
</script>
