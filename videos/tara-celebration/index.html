<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=480, height=360" /><title>Tara celebration</title><script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:480px;height:360px;overflow:hidden;background:#f4faf6}#root{position:relative;width:100%;height:100%;overflow:hidden}.clip{position:absolute;inset:0}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.halo{position:absolute;width:260px;height:260px;border-radius:50%;background:#e0f3e9}#tara{width:250px;height:233px;position:relative;inset:auto;display:block;transform-origin:50% 90%}.hf-catalog-confetti{position:absolute;inset:0;pointer-events:none}.particle{position:absolute;left:50%;top:52%;width:7px;height:12px;border-radius:3px;background:var(--c);transform:translate(var(--hf-px,0px),var(--hf-py,0px)) rotate(var(--hf-pr,0deg));opacity:var(--hf-po,0)}

      <path d="M73 90 Q5 70 22 25 Q50 8 70 58 Q62 8 98 12 Q127 37 90 90" fill="#71c6ad" stroke="#145955" stroke-width="3" />
      <path d="M28 28 Q53 30 64 72 M94 18 Q82 42 83 76" fill="none" stroke="#145955" stroke-width="4" />

</svg><div class="hf-catalog-confetti" id="confetti"></div></section></div><script>
const palette=['#f3be5a','#148884','#ef987d','#71c6ad'];
const container=document.getElementById('confetti');
for(let i=0;i<16;i++){const particle=document.createElement('span');particle.className='particle';particle.style.setProperty('--c',palette[i%palette.length]);container.appendChild(particle);}
const tl=gsap.timeline({paused:true});
tl.to('#tara',{scaleY:0.94,scaleX:1.035,duration:0.18,ease:'power2.in'},0.25);
tl.to('#tara',{y:-22,scaleY:1.02,scaleX:0.985,rotation:-3,duration:0.32,ease:'power2.out'},0.43);
tl.to('#tara',{y:0,scaleY:0.96,scaleX:1.025,rotation:0,duration:0.27,ease:'power2.in'},0.75);
tl.to('#tara',{scaleY:1,scaleX:1,duration:0.22,ease:'power2.out'},1.02);
tl.to('#halo',{scale:1.04,duration:0.35,ease:'sine.out'},0.43);
tl.to('#halo',{scale:1,duration:0.55,ease:'sine.inOut'},0.78);
const particles=gsap.utils.toArray('.hf-catalog-confetti .particle');
tl.fromTo(particles,{'--hf-po':0,'--hf-px':'0px','--hf-py':'0px','--hf-pr':'0deg'},{'--hf-po':1,'--hf-px':i=>(Math.cos(i*0.83)*155)+'px','--hf-py':i=>(-70-Math.sin(i*0.61)*70)+'px','--hf-pr':i=>(120+i*37)+'deg',duration:0.6,stagger:0.008,ease:'power2.out'},0.55);
tl.to(particles,{'--hf-py':i=>(100-Math.sin(i*0.61)*25)+'px','--hf-pr':i=>(240+i*37)+'deg','--hf-po':0,duration:1,stagger:0.008,ease:'power1.in'},1.28);
window.__timelines['tara-celebration']=tl;tl.seek(0);
</script></body></html>
