name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # Never expose credentials to fork PRs. No pull_request_target execution.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vidya-isolated-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL migration safety
        timeout-minutes: 3
        run: node test/migrations/postgres-harness.mjs --run-postgres-integration
        env:
          VIDYA_RUN_MIGRATION_INTEGRATION: "1"
          VIDYA_TEST_DATABASE_URL: ${{ secrets.VIDYA_TEST_DATABASE_URL }}
      - name: Isolated database integration tests
        run: node scripts/test-integration.mjs
        env:
          VIDYA_TEST_DATABASE_URL: ${{ secrets.VIDYA_TEST_DATABASE_URL }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency security audit
        run: npm run security:audit

      - name: Dependency mitigation regressions
        run: node --test test/security/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

      # Until 2026-08-11 ESLint had never actually run here: .eslintrc.json
      # extended next/core-web-vitals without eslint-config-next installed, so
      # both `npm run lint` and the build's lint step failed silently. Keep this
      # step separate from the build so a config regression is loud.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Migration runner tests
        run: node --test test/migrations/*.test.mjs

      - name: Build
        run: npm run build
        env:
          # The app is designed to build and run without secrets — AI features
          # degrade to offline fallbacks and Clerk runs keyless. If this step
          # ever needs a real key, that is a regression worth catching here.
          NEXT_TELEMETRY_DISABLED: "1"
